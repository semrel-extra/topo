# npm trusted publishing is bound to `ci.yaml` and the `gh-cicd` environment.
name: CI
on: [push, pull_request]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            target/cjs
            target/esm
            target/dts
          if-no-files-found: error
          retention-days: 7

  test:
    name: Unit tests, lint and types
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: target

      - name: Run checks
        timeout-minutes: 5
        run: |
          yarn test:unit
          yarn test:lint
          yarn test:types

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke (Node v${{ matrix.node-version }}, ${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 18
          - os: ubuntu-latest
            node-version: 26
          - os: windows-latest
            node-version: 26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Yarn 1 checks devDependency engines even with --production.
      - name: Setup install tools
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch runtime deps
        run: yarn install --production --frozen-lockfile --ignore-scripts

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: target

      - name: Setup runtime Node.js
        if: matrix.node-version != 26
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run smoke tests
        timeout-minutes: 5
        run: npm run test:smoke

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, smoke]
    environment: gh-cicd
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: target/coverage

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@56bee2d751c94b7bd8de22f64c9b5f398048e13f # v2.8.1
        with:
          oidc: true
          files: target/coverage/lcov.info

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: target

      - name: Semantic Release
        env:
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
          GH_USER: x-access-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_OIDC: true
          NPM_PROVENANCE: true
          npm_config_ignore_scripts: true
        run: npm_config_yes=true npx zx-semrel
