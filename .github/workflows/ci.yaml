# npm trusted publishing is bound to `ci.yaml` and the `gh-cicd` environment.
name: CI
on: [push, pull_request]

permissions: {}

jobs:
  test_push:
    name: Test on push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run tests
        timeout-minutes: 5
        run: yarn test

      - name: Upload coverage to Qlty
        if: github.ref == 'refs/heads/master'
        uses: qltysh/qlty-action/coverage@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2.8.0
        with:
          oidc: true
          files: target/coverage/lcov.info

  test_pr:
    name: Test PR (Node v${{ matrix.node-version }}, OS ${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup build tools
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build and check
        run: |
          yarn build
          yarn test:lint
          yarn test:types

      - name: Setup runtime Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run compatibility tests
        timeout-minutes: 5
        run: |
          node --import tsx ./node_modules/uvu/bin.js src/test/ts
          yarn test:it

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test_push
    environment: gh-cicd
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: write
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Semantic Release
        env:
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
          GH_USER: x-access-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_OIDC: true
          NPM_PROVENANCE: true
        run: npm_config_yes=true npx zx-semrel
